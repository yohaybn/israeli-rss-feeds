name: Tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Install generated-feed parser
        run: python -m pip install beautifulsoup4==4.14.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generated feed and relay tests
        run: |
          python generated/tests/run_tests.py
          python -m unittest discover -s generated/tests -p 'test_*.py' -v
          python generated/scripts/validate_feeds.py --sites generated/sites.json
          node --test generated/worker/index.test.mjs
