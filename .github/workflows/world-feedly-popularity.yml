name: World Feedly followers (manual)
# One-off, run by hand: fills feedly_subscribers for world/feeds.json from GitHub's network, because
# Feedly rate-limits some other networks. Pushes a branch and opens a PR; it never commits to main.
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  popularity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Feedly followers and Tranco ranks
        run: python scripts/world_popularity.py --all
      - name: Branch, push and open the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet world/ && { echo "nothing changed"; exit 0; }
          branch="popularity-feedly-$(date +%Y%m%d-%H%M)"
          git config user.name "feed-checker"
          git config user.email "actions@github.com"
          git checkout -b "$branch"
          git add world/
          git commit -m "world: Feedly followers for the international feeds"
          git push origin "$branch"
          answered=$(python - <<'PY'
          import json
          w = json.load(open('world/feeds.json'))
          f = [x for c in w['categories'] for x in c['feeds']]
          print(sum(1 for x in f if 'feedly' in (x.get('popularity') or {}).get('source', [])), 'of', len(f))
          PY
          )
          gh pr create --base main --head "$branch" --title "world: Feedly followers for the international feeds" \
            --body "Fills feedly_subscribers (public Feedly API, run from GitHub's network). Feeds Feedly answered for: ${answered}. Feeds Feedly does not know stay null. Generated by the manual workflow world-feedly-popularity.yml; nothing is written outside this repo." \
            || echo "Branch pushed; open the PR by hand (Actions may not be allowed to create PRs)."
